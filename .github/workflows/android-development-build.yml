name: Android Development Build

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check Expo project configuration
        run: npx expo config --type public

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Set up EAS CLI
        run: npm install --global eas-cli

      - name: Build Android development APK
        run: eas build --platform android --profile development --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
